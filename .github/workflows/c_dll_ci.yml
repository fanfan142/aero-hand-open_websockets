name: C DLL CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-dll:
    name: Linux shared library and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure C DLL and CTest
        run: cmake -S c_dll -B c_dll/build -DCMAKE_C_COMPILER=cc -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build shared library and native tests
        run: cmake --build c_dll/build --parallel

      - name: Run RFC handshake and socket regressions
        run: ctest --test-dir c_dll/build --output-on-failure --timeout 15
