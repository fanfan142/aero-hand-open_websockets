name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((100000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "android/local.properties"

      - name: Run Android unit tests
        working-directory: "android"
        run: |
          chmod +x "./gradlew"
          "./gradlew" :app:testDebugUnitTest -PCI_VERSION_NAME="${VERSION_NAME}" -PCI_VERSION_CODE="${APP_VERSION_CODE}" --stacktrace --no-daemon

      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-unit-test-reports
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Prepare signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/android-signing.jks

      - name: Build release APK
        working-directory: "android"
        env:
          ANDROID_SIGNING_STORE_FILE: /tmp/android-signing.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          "./gradlew" :app:assembleRelease -PCI_VERSION_NAME="${VERSION_NAME}" -PCI_VERSION_CODE="${APP_VERSION_CODE}" --stacktrace --no-daemon 2>&1 | tee "release-build.log"
          tail -100 "release-build.log"
          test -f "app/build/outputs/apk/release/app-release.apk"

      - name: Rename APK to versioned name
        run: |
          mkdir -p android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/HandControl-${VERSION_NAME}.apk"
          ls -la android/app/build/outputs/apk/release/HandControl-${VERSION_NAME}.apk

      - name: Verify APK signature and record metadata
        run: |
          APK="android/app/build/outputs/apk/release/HandControl-${VERSION_NAME}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android/apk-signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > android/apk-metadata.txt
          grep -F "versionName='${VERSION_NAME}'" android/apk-metadata.txt
          grep -F "versionCode='${APP_VERSION_CODE}'" android/apk-metadata.txt
          (cd android/app/build/outputs/apk/release && sha256sum "HandControl-${VERSION_NAME}.apk" > ANDROID_SHA256SUMS.txt)

      - name: Upload APK verification evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-verification
          path: |
            android/apk-signature.txt
            android/apk-metadata.txt
            android/app/build/outputs/apk/release/ANDROID_SHA256SUMS.txt

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-build-log
          path: android/release-build.log

      - name: Upload release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aero-hand-release-apk
          path: android/app/build/outputs/apk/release/HandControl-*.apk

      - name: Create GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aero Hand Console ${{ github.ref_name }}
          make_latest: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Android 云端签名构建。带预发布后缀的标签为候选版，不代表已通过真机验收。

            - Commit: ${{ github.sha }}
            - Workflow: ${{ github.workflow }}
            - WiFi / USB / BLE 请搭配同一 Release 中的 v0.2.0 左右手固件；旧固件没有 BLE 服务
            - BLE 使用加密绑定的 Just Works 配对，不具备 MITM 身份认证；首次测试请勿连接执行器
            - 手机校准、无线往返与机械手低速安全验收记录见仓库 docs；云端绿灯不能替代真机结果
          generate_release_notes: true

      - name: Upload APK to release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} \
            "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/HandControl-${VERSION_NAME}.apk" \
            "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/ANDROID_SHA256SUMS.txt" --clobber

      - name: Mark release latest after APK and firmware assets are ready
        if: success() && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            if gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -q '^firmware_v0.2.0_lefthand.bin$' && \
               gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -q '^firmware_v0.2.0_righthand.bin$'; then
              gh release edit "${GITHUB_REF_NAME}" --latest
              exit 0
            fi
            sleep 20
          done
          echo "Firmware assets missing; keeping release non-latest" >&2
          exit 1
