name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_VERSION_NAME: 1.4.17

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Set preview version
        run: |
          echo "PREVIEW_VERSION_NAME=${BASE_VERSION_NAME}-t${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "PREVIEW_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PCI_VERSION_NAME="$PREVIEW_VERSION_NAME" -PCI_VERSION_CODE="$PREVIEW_VERSION_CODE" --stacktrace --no-daemon 2>&1 | tee build.log
          tail -100 build.log
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aero-hand-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
