name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        working-directory: "python_bridge"
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest "python_bridge/tests" "scripts/tests" -q

  build:
    needs: python-tests
    runs-on: ubuntu-latest
    env:
      BASE_VERSION_NAME: 1.5.5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "android/local.properties"
      - name: Set preview version
        run: |
          APP_VERSION_CODE=$((100000 + $(git rev-list --count HEAD)))
          echo "PREVIEW_VERSION_NAME=${BASE_VERSION_NAME}-t${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "PREVIEW_VERSION_CODE=${APP_VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Run Android unit tests
        working-directory: "android"
        run: |
          chmod +x "./gradlew"
          "./gradlew" :app:testDebugUnitTest -PCI_VERSION_NAME="$PREVIEW_VERSION_NAME" -PCI_VERSION_CODE="$PREVIEW_VERSION_CODE" --stacktrace --no-daemon

      - name: Prepare preview signing keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "/tmp/android-signing.jks"

      - name: Build signed preview APK
        if: github.event_name != 'pull_request'
        working-directory: "android"
        env:
          ANDROID_SIGNING_STORE_FILE: /tmp/android-signing.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          "./gradlew" :app:assembleRelease -PCI_VERSION_NAME="$PREVIEW_VERSION_NAME" -PCI_VERSION_CODE="$PREVIEW_VERSION_CODE" --stacktrace --no-daemon 2>&1 | tee "build.log"
          tail -100 "build.log"
          test -f "app/build/outputs/apk/release/app-release.apk"

      - name: Build pull request debug APK
        if: github.event_name == 'pull_request'
        working-directory: "android"
        run: |
          set -o pipefail
          "./gradlew" :app:assembleDebug -PCI_VERSION_NAME="$PREVIEW_VERSION_NAME" -PCI_VERSION_CODE="$PREVIEW_VERSION_CODE" --stacktrace --no-daemon 2>&1 | tee "build.log"
          tail -100 "build.log"
          test -f "app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aero-hand-preview-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
