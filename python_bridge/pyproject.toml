[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-ws-python"
version = "1.0.0"
description = "Aero Hand Open Python WebSocket Bridge - Local USB to WebSocket server"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "fanfan142", email = "fanfan142@users.noreply.github.com"}
]
maintainers = [
    {name = "fanfan142", email = "fanfan142@users.noreply.github.com"}
]
keywords = ["robotics", "websocket", "servo", "esp32", "aero-hand"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Robotics",
]

dependencies = [
    "websockets>=10.0,<16",
    "pyserial>=3.5",
    "aero-open-sdk @ git+https://github.com/chestnut-robotics/aero-hand-open.git@7bb2f23485a7d440960c21046da642de132b7745#subdirectory=sdk",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "flake8>=6.0",
]

[project.urls]
Homepage = "https://github.com/fanfan142/aero-hand-open_websockets"
Documentation = "https://github.com/fanfan142/aero-hand-open_websockets#readme"
Repository = "https://github.com/fanfan142/aero-hand-open_websockets"

[tool.setuptools.packages.find]
where = ["."]
include = ["aero_ws_python*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
